name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System Python on purpose: PyGObject comes from apt, and a
      # setup-python interpreter cannot see it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-pil xvfb \
            dpkg-dev desktop-file-utils

      - name: Compile every module
        run: python3 -m compileall -q claude_pet tools tests

      - name: Shell scripts parse
        run: |
          bash -n install.sh
          bash -n claude-pet
          bash -n completions/claude-pet.bash

      # Stdlib only, so these need no display.
      - name: Aggregation and liveness tests
        run: python3 tests/test_aggregate.py

      # The Claude Desktop side stubs /proc and D-Bus, so it runs on a headless
      # box with the app nowhere in sight.
      - name: Claude Desktop tests
        run: python3 tests/test_desktop.py

      - name: Hook event tests
        run: python3 tests/test_hook.py

      # Event-name translation and process recognition across agents.
      - name: Agent registry tests
        run: python3 tests/test_agents.py

      # Which window a click jumps to, with wmctrl stubbed.
      - name: Jump target tests
        run: python3 tests/test_jump.py

      # Deciding there is an update, and reporting how applying it went.
      - name: Update logic tests
        run: python3 tests/test_update.py

      # Placement arithmetic, against a stand-in for the screen layout.
      - name: Geometry tests
        run: python3 tests/test_geometry.py

      # Whether the pointer's position is worth believing, which on Wayland
      # it often is not, and who to ask instead.
      - name: Pointer visibility tests
        run: python3 tests/test_pointer.py

      # The shell extension has to be something GNOME would actually load,
      # and has to come off again cleanly.
      - name: Shell extension tests
        run: python3 tests/test_shellext.py

      # Telling a stroke apart from a pointer merely crossing the sprite.
      - name: Petting tests
        run: python3 tests/test_petting.py

      # Throw physics: it must always come to rest, and on screen.
      - name: Motion tests
        run: python3 tests/test_motion.py

      # Which interpreter the launcher picks, with stand-ins on PATH.
      - name: Launcher tests
        run: python3 tests/test_launcher.py

      - name: Bundled pack parses
        run: |
          python3 - <<'PY'
          from claude_pet import sprites
          pet = sprites.load_pet("assets/pets/pocket")
          missing = [n for n, f in pet.animations.items() if not f]
          assert not missing, f"empty animation rows: {missing}"
          assert pet.cell == (192, 208), pet.cell
          print(f"{pet.id} v{pet.version}: {sum(pet.frame_counts.values())} frames")
          PY

      - name: Regenerating the bundled pack still parses
        run: |
          python3 tools/make_default_pack.py
          python3 -c "from claude_pet import sprites; sprites.load_pet('assets/pets/pocket')"

      # This is the check that earns its keep: overlay.py pins five GI
      # namespaces, and getting one wrong stops the pet from ever appearing.
      - name: Overlay imports under a virtual display
        run: xvfb-run -a python3 -c "import claude_pet.overlay; print('overlay ok')"

      # Importing is not enough: a deleted constant shipped in three
      # releases because the only code touching it places a pet with no
      # saved position and walks one that wanders. This drives both.
      - name: Overlay smoke test
        run: xvfb-run -a python3 tests/test_overlay_smoke.py

      - name: CLI runs
        run: |
          ./claude-pet --help > /dev/null
          ./claude-pet list
          ./claude-pet preview pocket -o /tmp/preview.png
          ./claude-pet _complete -- 1 "" "claude-pet" "" | head -5

      # The package is how most people install this, so a broken build script
      # should fail here rather than at release time.
      - name: Package builds
        run: |
          path="$(packaging/build-deb.sh)"
          dpkg-deb -I "$path" | head -20
          dpkg-deb -x "$path" /tmp/debroot
          /tmp/debroot/usr/lib/claude-pet/claude-pet --help > /dev/null
          test -L /tmp/debroot/usr/bin/claude-pet
          desktop-file-validate /tmp/debroot/usr/share/applications/claude-pet.desktop
          desktop-file-validate /tmp/debroot/etc/xdg/autostart/claude-pet-autostart.desktop

      - name: Hook bridge accepts every event
        run: |
          for event in SessionStart UserPromptSubmit PreToolUse PostToolUse \
                       Notification Stop SubagentStop SessionEnd; do
            echo "{\"hook_event_name\":\"$event\",\"session_id\":\"ci\"}" \
              | ./claude-pet hook || exit 1
          done
          ./claude-pet status
