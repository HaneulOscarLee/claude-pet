name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pillow is needed only to cut the icon out of the bundled spritesheet.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil dpkg-dev

      - name: Build the package
        id: build
        run: |
          path="$(packaging/build-deb.sh)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Check what it contains
        run: |
          dpkg-deb -I "${{ steps.build.outputs.path }}"
          dpkg-deb -c "${{ steps.build.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: ${{ steps.build.outputs.path }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          Download the `.deb` below and open it. GNOME Software — or
          `sudo apt install ./claude-pet_*.deb` — pulls in GTK, Pillow and
          wmctrl for you.

          Then launch **claude-pet** once from your applications menu. That
          installs a sprite pack, wires the Claude Code hooks into your own
          `~/.claude/settings.json`, and starts the pet. No terminal needed.
          NOTES

          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "claude-pet $GITHUB_REF_NAME" \
              --notes-file "$notes"
          gh release upload "$GITHUB_REF_NAME" "$DEB" --clobber
